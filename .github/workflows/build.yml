name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar proyecto
        run: |
          if [ -f RelojSideralWidget.zip ]; then
            unzip -o RelojSideralWidget.zip
            rm -f RelojSideralWidget.zip
          fi
          if [ -d RelojSideralWidget ]; then
            cp -a RelojSideralWidget/. .
            rm -rf RelojSideralWidget
          fi
          ls -la

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RelojSideral-APK
          path: app/build/outputs/apk/debug/app-debug.apk
